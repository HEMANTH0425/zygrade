name: sovereign_mobile
description: Sovereign Mobile – Zygarde WebUI client with Smart Bag Manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.7.0

  # Background service (foreground Android service)
  flutter_background_service: ^5.0.9
  flutter_background_service_android: ^6.2.3

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Persistence
  shared_preferences: ^2.3.2

  # Local file access
  path_provider: ^2.1.4

  # UI
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/item_names.json
